worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 2048; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # Do not log query strings or credentials.
    log_format gateway '$remote_addr $request_method $uri $status $limit_req_status';
    access_log /dev/stdout gateway;
    sendfile on;
    keepalive_timeout 30;
    client_max_body_size 1m;

    # Empty keys are not counted. Match normalized URI, independent of arguments.
    map $uri $submit_total {
        default "";
        ~^/api/voucher-order/seckill/[0-9]+/?$ submit;
    }
    map $submit_total $submit_ip {
        default $binary_remote_addr;
        "" "";
    }
    limit_req_zone $submit_total zone=submit_total:1m rate=500r/s;
    limit_req_zone $submit_ip zone=submit_ip:10m rate=10r/s;

    map $uri $token_total {
        default "";
        ~^/api/voucher-order/seckill/token/[0-9]+/?$ token;
    }
    map $token_total $token_ip {
        default $binary_remote_addr;
        "" "";
    }
    limit_req_zone $token_total zone=token_total:1m rate=200r/s;
    limit_req_zone $token_ip zone=token_ip:10m rate=10r/s;

    map $uri $result_total {
        default "";
        ~^/api/voucher-order/seckill/result/?$ result;
    }
    map $result_total $result_ip {
        default $binary_remote_addr;
        "" "";
    }
    limit_req_zone $result_total zone=result_total:1m rate=1000r/s;
    limit_req_zone $result_ip zone=result_ip:10m rate=30r/s;

    upstream backend { server 127.0.0.1:8085; keepalive 32; }
    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        location / { try_files $uri $uri/ /index.html; }
        location /api/ {
            limit_req zone=submit_total burst=100 nodelay;
            limit_req zone=submit_ip burst=10 nodelay;
            limit_req zone=token_total burst=50 nodelay;
            limit_req zone=token_ip burst=10 nodelay;
            limit_req zone=result_total burst=200 nodelay;
            limit_req zone=result_ip burst=30 nodelay;
            limit_req_status 429;
            error_page 429 = @rate_limited;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            # This gateway is the public edge: discard client-supplied proxy headers.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 3s;
            proxy_read_timeout 15s;
            proxy_pass http://backend/;
        }
        location @rate_limited {
            default_type application/json;
            add_header Retry-After 1 always;
            return 429 '{"success":false,"code":"RATE_LIMITED","errorMsg":"请求过于频繁，请稍后使用原请求重试"}';
        }
    }
}
