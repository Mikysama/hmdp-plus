name: hmdp-plus

services:
  mysql:
    image: mysql:8.4
    container_name: hmdp-plus-mysql
    network_mode: host
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql/1_create_database.sql:/docker-entrypoint-initdb.d/01-create-database.sql:ro
      - ./sql/hmdp_0.sql:/docker-entrypoint-initdb.d/02-hmdp-0.sql:ro
      - ./sql/hmdp_1.sql:/docker-entrypoint-initdb.d/03-hmdp-1.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -proot --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  redis:
    image: redis:7.4-alpine
    container_name: hmdp-plus-redis
    network_mode: host
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.9.1
    container_name: hmdp-plus-kafka
    network_mode: host
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@127.0.0.1:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  backend:
    image: eclipse-temurin:21-jre-noble
    container_name: hmdp-plus-backend
    network_mode: host
    restart: unless-stopped
    environment:
      SERVER_ADDRESS: 127.0.0.1
      SPRING_APPLICATION_JSON: '{"rate-limit":{"trusted-proxies":["127.0.0.1"]}}'
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    volumes:
      - ./hmdp-core-service/target/hmdp-core-service-0.0.1-SNAPSHOT.jar:/app/hmdp.jar:ro
    command: ["java", "-jar", "/app/hmdp.jar"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8085'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  gateway:
    image: nginx:1.28-alpine
    container_name: hmdp-plus-gateway
    network_mode: host
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./hmdp-vue3/dist:/usr/share/nginx/html:ro

volumes:
  mysql-data:
  redis-data:
  kafka-data:
