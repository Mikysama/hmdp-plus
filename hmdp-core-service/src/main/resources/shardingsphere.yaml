dataSources: 
  ds_0:
    dataSourceClassName: com.zaxxer.hikari.HikariDataSource
    driverClassName: com.mysql.cj.jdbc.Driver
    jdbcUrl: jdbc:mysql://127.0.0.1:3306/hmdp_0?useUnicode=true&characterEncoding=UTF-8&rewriteBatchedStatements=true&allowMultiQueries=true&serverTimezone=Asia/Shanghai&connectionTimeZone=Asia/Shanghai&forceConnectionTimeZoneToSession=true&autoReconnect=true
    username: root
    password: root
    hikari:
      # 连接池配置优化
      minimum-idle: 30                    # 最小空闲连接数(提升至30)
      maximum-pool-size: 100              # 最大连接池大小(提升至100)
      connection-timeout: 20000           # 连接超时时间(缩短至20秒)
      idle-timeout: 300000                # 空闲连接超时时间(5分钟)
      max-lifetime: 1800000               # 连接最大生命周期(30分钟)
      leak-detection-threshold: 30000     # 连接泄漏检测阈值(30秒)
      validation-timeout: 5000            # 连接验证超时时间(5秒)
  ds_1:
    dataSourceClassName: com.zaxxer.hikari.HikariDataSource
    driverClassName: com.mysql.cj.jdbc.Driver
    jdbcUrl: jdbc:mysql://127.0.0.1:3306/hmdp_1?useUnicode=true&characterEncoding=UTF-8&rewriteBatchedStatements=true&allowMultiQueries=true&serverTimezone=Asia/Shanghai&connectionTimeZone=Asia/Shanghai&forceConnectionTimeZoneToSession=true&autoReconnect=true
    username: root
    password: root
    hikari:
      # 连接池配置优化
      minimum-idle: 30                    # 最小空闲连接数(提升至30)
      maximum-pool-size: 100              # 最大连接池大小(提升至100)
      connection-timeout: 20000           # 连接超时时间(缩短至20秒)
      idle-timeout: 300000                # 空闲连接超时时间(5分钟)
      max-lifetime: 1800000               # 连接最大生命周期(30分钟)
      leak-detection-threshold: 30000     # 连接泄漏检测阈值(30秒)
      validation-timeout: 5000            # 连接验证超时时间(5秒)
    
rules:
  - !SHARDING
    tables:
      tb_seckill_voucher:
        actualDataNodes: ds_${0..1}.tb_seckill_voucher_${0..1}
        databaseStrategy:
          standard:
            shardingColumn: voucher_id
            shardingAlgorithmName: databaseSeckillVoucherModModel
        tableStrategy:
          standard:
            shardingColumn: voucher_id
            shardingAlgorithmName: tableSeckillVoucherModModel
      tb_user:
        actualDataNodes: ds_${0..1}.tb_user_${0..1}
        databaseStrategy:
          standard:
            shardingColumn: id
            shardingAlgorithmName: databaseUserModModel
        tableStrategy:
          standard:
            shardingColumn: id
            shardingAlgorithmName: tableUserModModel
      tb_user_info:
        actualDataNodes: ds_${0..1}.tb_user_info_${0..1}
        databaseStrategy:
          standard:
            shardingColumn: user_id
            shardingAlgorithmName: databaseUserInfoModModel
        tableStrategy:
          standard:
            shardingColumn: user_id
            shardingAlgorithmName: tableUserInfoModModel
      tb_user_phone:
        actualDataNodes: ds_${0..1}.tb_user_phone_${0..1}
        databaseStrategy:
          standard:
            shardingColumn: phone
            shardingAlgorithmName: databaseUserPhoneHashModModel
        tableStrategy:
          standard:
            shardingColumn: phone
            shardingAlgorithmName: tableUserPhoneHashModModel
      tb_voucher:
        actualDataNodes: ds_${0..1}.tb_voucher_${0..1}
        databaseStrategy:
          standard:
            shardingColumn: id
            shardingAlgorithmName: databaseVoucherModModel
        tableStrategy:
          standard:
            shardingColumn: id
            shardingAlgorithmName: tableVoucherModModel
      tb_voucher_order:
        actualDataNodes: ds_${0..1}.tb_voucher_order_${0..1}
        databaseStrategy:
          standard:
            shardingColumn: voucher_id
            shardingAlgorithmName: databaseVoucherOrderModModel
        tableStrategy:
          standard:
            shardingColumn: voucher_id
            shardingAlgorithmName: tableVoucherOrderModModel
      tb_voucher_order_router:
        actualDataNodes: ds_${0..1}.tb_voucher_order_router_${0..1}
        databaseStrategy:
          standard:
            shardingColumn: order_id
            shardingAlgorithmName: databaseVoucherOrderRouterModModel
        tableStrategy:
          standard:
            shardingColumn: order_id
            shardingAlgorithmName: tableVoucherOrderRouterModModel
      tb_voucher_reconcile_log:
        actualDataNodes: ds_${0..1}.tb_voucher_reconcile_log_${0..1}
        databaseStrategy:
          standard:
            shardingColumn: voucher_id
            shardingAlgorithmName: databaseVoucherReconcileLogModModel
        tableStrategy:
          standard:
            shardingColumn: voucher_id
            shardingAlgorithmName: tableVoucherReconcileLogModModel
      tb_seckill_request:
        actualDataNodes: ds_${0..1}.tb_seckill_request_${0..1}
        databaseStrategy:
          standard:
            shardingColumn: voucher_id
            shardingAlgorithmName: databaseSeckillVoucherModModel
        tableStrategy:
          standard:
            shardingColumn: voucher_id
            shardingAlgorithmName: tableSeckillRequestV2
      tb_seckill_active_purchase:
        actualDataNodes: ds_${0..1}.tb_seckill_active_purchase_${0..1}
        databaseStrategy:
          standard:
            shardingColumn: voucher_id
            shardingAlgorithmName: databaseSeckillVoucherModModel
        tableStrategy:
          standard:
            shardingColumn: voucher_id
            shardingAlgorithmName: tableSeckillActivePurchaseV2
      tb_seckill_operation:
        actualDataNodes: ds_${0..1}.tb_seckill_operation_${0..1}
        databaseStrategy:
          standard:
            shardingColumn: voucher_id
            shardingAlgorithmName: databaseSeckillVoucherModModel
        tableStrategy:
          standard:
            shardingColumn: voucher_id
            shardingAlgorithmName: tableSeckillOperationV2
      tb_seckill_outbox:
        actualDataNodes: ds_${0..1}.tb_seckill_outbox_${0..1}
        databaseStrategy:
          standard:
            shardingColumn: voucher_id
            shardingAlgorithmName: databaseSeckillVoucherModModel
        tableStrategy:
          standard:
            shardingColumn: voucher_id
            shardingAlgorithmName: tableSeckillOutboxV2
      tb_seckill_subscription:
        actualDataNodes: ds_${0..1}.tb_seckill_subscription_${0..1}
        databaseStrategy:
          standard:
            shardingColumn: voucher_id
            shardingAlgorithmName: databaseSeckillVoucherModModel
        tableStrategy:
          standard:
            shardingColumn: voucher_id
            shardingAlgorithmName: tableSeckillSubscriptionV2
      tb_seckill_recovery:
        actualDataNodes: ds_${0..1}.tb_seckill_recovery_${0..1}
        databaseStrategy:
          standard:
            shardingColumn: voucher_id
            shardingAlgorithmName: databaseSeckillVoucherModModel
        tableStrategy:
          standard:
            shardingColumn: voucher_id
            shardingAlgorithmName: tableSeckillRecoveryV2
      tb_seckill_notification:
        actualDataNodes: ds_${0..1}.tb_seckill_notification_${0..1}
        databaseStrategy:
          standard:
            shardingColumn: voucher_id
            shardingAlgorithmName: databaseSeckillVoucherModModel
        tableStrategy:
          standard:
            shardingColumn: voucher_id
            shardingAlgorithmName: tableSeckillNotificationV2
    bindingTables:
      - tb_voucher,tb_seckill_voucher,tb_voucher_order,tb_voucher_reconcile_log,tb_seckill_request,tb_seckill_active_purchase,tb_seckill_operation,tb_seckill_outbox,tb_seckill_subscription,tb_seckill_recovery,tb_seckill_notification
    broadcastTables:
      - tb_blog,tb_blog_comments,tb_follow,tb_rollback_failure_log,tb_shop,tb_shop_type,tb_sign
    shardingAlgorithms:
      databaseSeckillVoucherModModel:
        type: MOD
        props:
          sharding-count: 2
      tableSeckillVoucherModModel:
        type: INLINE
        props:
          algorithm-expression: tb_seckill_voucher_${voucher_id.intdiv(2) % 2}
          allow-range-query-with-inline-sharding: true
      databaseUserModModel:
        type: MOD
        props:
          sharding-count: 2
      tableUserModModel:
        type: INLINE
        props:
          algorithm-expression: tb_user_${id.intdiv(2) % 2}
      databaseUserInfoModModel:
        type: MOD
        props:
          sharding-count: 2
      tableUserInfoModModel:
        type: INLINE
        props:
          algorithm-expression: tb_user_info_${user_id.intdiv(2) % 2}
      databaseUserPhoneHashModModel:
        type: HASH_MOD
        props:
          sharding-count: 2
      tableUserPhoneHashModModel:
        type: INLINE
        props:
          algorithm-expression: tb_user_phone_${Math.abs(phone.hashCode()).intdiv(2) % 2}
      databaseVoucherModModel:
        type: MOD
        props:
          sharding-count: 2
      tableVoucherModModel:
        type: INLINE
        props:
          algorithm-expression: tb_voucher_${id.intdiv(2) % 2}
          allow-range-query-with-inline-sharding: true
      databaseVoucherOrderModModel:
        type: MOD
        props:
          sharding-count: 2
      tableVoucherOrderModModel:
        type: INLINE
        props:
          algorithm-expression: tb_voucher_order_${voucher_id.intdiv(2) % 2}
      databaseVoucherOrderRouterModModel:
        type: HASH_MOD
        props:
          sharding-count: 2
      tableVoucherOrderRouterModModel:
        type: INLINE
        props:
          algorithm-expression: tb_voucher_order_router_${order_id.intdiv(2) % 2}
      databaseVoucherReconcileLogModModel:
        type: MOD
        props:
          sharding-count: 2
      tableVoucherReconcileLogModModel:
        type: INLINE
        props:
          algorithm-expression: tb_voucher_reconcile_log_${voucher_id.intdiv(2) % 2}
      tableSeckillRequestV2:
        type: INLINE
        props:
          algorithm-expression: tb_seckill_request_${voucher_id.intdiv(2) % 2}
      tableSeckillActivePurchaseV2:
        type: INLINE
        props:
          algorithm-expression: tb_seckill_active_purchase_${voucher_id.intdiv(2) % 2}
      tableSeckillOperationV2:
        type: INLINE
        props:
          algorithm-expression: tb_seckill_operation_${voucher_id.intdiv(2) % 2}
      tableSeckillOutboxV2:
        type: INLINE
        props:
          algorithm-expression: tb_seckill_outbox_${voucher_id.intdiv(2) % 2}
      tableSeckillSubscriptionV2:
        type: INLINE
        props:
          algorithm-expression: tb_seckill_subscription_${voucher_id.intdiv(2) % 2}
      tableSeckillRecoveryV2:
        type: INLINE
        props:
          algorithm-expression: tb_seckill_recovery_${voucher_id.intdiv(2) % 2}
      tableSeckillNotificationV2:
        type: INLINE
        props:
          algorithm-expression: tb_seckill_notification_${voucher_id.intdiv(2) % 2}
props:
  sql-show: true
